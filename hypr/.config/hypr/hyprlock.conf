general {
  grace = 2
  hide_cursor = true
  no_fade_in = true
}

background {
  monitor =
  path = ~/Pictures/garret-parker-unsplash.jpg
  blur_passes = 3
  blur_size = 8
  noise = 0.0117
  contrast = 0.9
  brightness = 0.8
  vibrancy = 0.1696
  vibrancy_darkness = 0.05
}

input-field {
  monitor =
  size = 300, 60
  rounding = -1
  outline_thickness = 3
  dots_size = 0.25
  dots_spacing = 0.3
  dots_center = true
  outer_color = rgba(255, 255, 255, 0.2)
  inner_color = rgba(0, 0, 0, 0.5)
  font_color = rgb(230, 230, 230)
  fade_on_empty = true
  placeholder_text = <i>Password...</i>
  check_color = rgb(51, 204, 255)
  fail_color = rgb(220, 60, 60)
  fail_text = <i>$FAIL ($ATTEMPTS)</i>
  capslock_color = rgb(255, 170, 60)
  position = 0, -120
  halign = center
  valign = center
  shadow_passes = 2
}

label {
  monitor =
  text = $TIME
  font_size = 110
  font_family = Noto Sans
  color = rgba(255, 255, 255, 0.95)
  position = 0, 300
  halign = center
  valign = center
  shadow_passes = 3
  shadow_size = 4
}

label {
  monitor =
  text = cmd[update:43200000] date "+%A, %B %-d"
  font_size = 26
  font_family = Noto Sans
  color = rgba(255, 255, 255, 0.85)
  position = 0, 200
  halign = center
  valign = center
  shadow_passes = 3
}

label {
  monitor =
  text = Hi $USER
  font_size = 18
  font_family = Noto Sans
  color = rgba(255, 255, 255, 0.7)
  position = 0, -40
  halign = center
  valign = center
  shadow_passes = 2
}
